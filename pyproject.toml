[project]
name = "dubtitlerr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pysubs2>=1.7", "faster-whisper>=1.2", "jellyfish>=1.0"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
# analysis: tools/ scripts only (timing_compare.py's --vad webrtcvad backend), never
# imported by the live pipeline. Split out because webrtcvad is a C-extension with no
# prebuilt wheel for this repo's py3.14 dev venv (see tools/vad.py's module docstring) --
# `pip install -e .[dev]` must keep working without it. `--vad ffmpeg-silencedetect` is
# the dep-free fallback when this extra isn't installed.
analysis = ["webrtcvad>=2.0"]

# This is a flat collection of top-level pipeline scripts (mux.py, generate.py, ...),
# not an importable library — tests reach them via conftest.py's sys.path insert, not
# a package import. Tell setuptools there's nothing to package so `pip install -e
# ".[dev]"` (used purely to pull in the runtime + dev dependencies) doesn't choke on
# auto-discovering specs/, glossaries/, tests/, tools/ as spurious top-level packages.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py39"
# Design docs hand-align the comments in their illustrative Python blocks; ruff
# formats code inside Markdown fences by default and collapses that alignment.
# The real .py files are still formatted -- only prose documents are exempt.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# The existing scripts use a deliberate terse one-liner house style
# (`if x: return`, `a; b`). Keep the real-bug rules; don't fight the style.
ignore = ["E701", "E702"]
