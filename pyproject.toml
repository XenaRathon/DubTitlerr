[project]
name = "dubtitlerr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pysubs2>=1.7", "faster-whisper>=1.2", "jellyfish>=1.0"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]

# This is a flat collection of top-level pipeline scripts (mux.py, generate.py, ...),
# not an importable library — tests reach them via conftest.py's sys.path insert, not
# a package import. Tell setuptools there's nothing to package so `pip install -e
# ".[dev]"` (used purely to pull in the runtime + dev dependencies) doesn't choke on
# auto-discovering specs/, glossaries/, tests/, tools/ as spurious top-level packages.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# The existing scripts use a deliberate terse one-liner house style
# (`if x: return`, `a; b`). Keep the real-bug rules; don't fight the style.
ignore = ["E701", "E702"]
